[project]
name = "infinidev"
version = "0.19.0"
description = "A terminal-based AI programming tool using agent loops."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Andres Borek", email = "andres@infinibay.net" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

dependencies = [
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.81.0,!=1.82.7,!=1.82.8",
    "ollama>=0.6.0",
    "chromadb>=1.1.0",
    "numpy>=2.0.0",
    "tokenizers>=0.22.0",
    "Pillow>=10.0.0",
    "prompt-toolkit>=3.0.43",
    "click>=8.1.7",
    "httpx>=0.28.0",
    "duckduckgo-search>=8.1.0",
    "trafilatura>=2.0.0",
    "textual>=8.1.1",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-json>=0.24.0",
    "tree-sitter-html>=0.23.0",
    "tree-sitter-css>=0.23.0",
    "tree-sitter-bash>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-toml>=0.6.0",
    "tree-sitter-yaml>=0.6.0",
    "tree-sitter-xml>=0.7.0",
    "tree-sitter-markdown>=0.3.0",
    "tree-sitter-regex>=0.24.0",
    "watchfiles>=0.24.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-c>=0.24.1",
    "yappi>=1.6.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-kotlin>=1.1.0",
    "wordfreq>=3.1.1",
    "langdetect>=1.0.9",
    "ken-rank>=0.13.1",
]

[project.urls]
Homepage = "https://github.com/Infinibay/infinidev"
Repository = "https://github.com/Infinibay/infinidev.git"
Issues = "https://github.com/Infinibay/infinidev/issues"

[project.scripts]
infinidev = "infinidev.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/infinidev"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/infinidev",
    "/LICENSE.md",
    "/README.md",
    "/pyproject.toml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/finetune", "tests/examples/taskqueue"]
#   uv run pytest --override-ini="addopts="
[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13.0.0"]
# MNN-backed embedder — ~10x faster than ChromaDB ONNX on CPU, identical
# output (cosine 1.0000 vs ONNX). Opt-in via INFINIDEV_MNN_MODEL_PATH.
# Install: `pip install 'infinidev[mnn]'` then run
# `python scripts/convert_minilm_to_mnn.py`.
mnn = ["MNN>=3.5.0", "transformers>=4.40,<5"]
finetune = [
    "accelerate>=1.10,<2",
    "bitsandbytes>=0.46,<1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "ctranslate2>=4.6,<5",
    "datasets>4.1,<4.4",
    "deepspeed>=0.17,<1; platform_system == 'Linux'",
    "peft>=0.17,<1",
    "sacremoses>=0.1,<1",
    "sentencepiece>=0.2,<1",
    "torch>=2.7,<3",
    "transformers>=4.57.1,<5",
]
finetune-unsloth = [
    "datasets>4.1,<4.4",
    "torch>=2.7,<3",
    "transformers>=4.57.1,<5",
    "trl>=0.24,<2",
    "unsloth>=2026.3.17,<2027; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "chardet>=5.2,<6",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "swebench>=4.1.0",
]
